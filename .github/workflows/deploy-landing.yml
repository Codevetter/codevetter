name: Deploy Landing Page

# Rollback: Cloudflare Pages preserves every deployment. Roll back via
# dash.cloudflare.com → Pages → codevetter → Deployments → "Rollback to this
# deployment". The codevetter.com Worker can be rolled back with
# `wrangler versions rollback --config wrangler.worker.jsonc` from
# apps/landing-page-astro/.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy landing page
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write # Record the Cloudflare Pages deployment.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static landing page and verified docs
        env:
          PUBLIC_SAASMAKER_NEWSLETTER_KEY: ${{ vars.PUBLIC_SAASMAKER_NEWSLETTER_KEY }}
        run: pnpm run build:landing

      - name: Verify required static routes
        run: |
          test -f apps/landing-page-astro/dist/index.html
          test -f apps/landing-page-astro/dist/privacy.html
          test -f apps/landing-page-astro/dist/download.html
          test -f apps/landing-page-astro/dist/sitemap-index.xml
          test -f apps/landing-page-astro/dist/robots.txt
          test -f apps/landing-page-astro/dist/docs/index.html
          node apps/landing-page-astro/scripts/verify-agent-surfaces.mjs

      - name: Check Cloudflare deploy secrets
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Cloudflare deploy token configured; skipping Pages deploy and smoking the live landing page."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.deploy_enabled == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/landing-page-astro/dist --project-name=codevetter --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy codevetter.com Worker (bypass stale zone cache)
        if: steps.cloudflare.outputs.deploy_enabled == 'true'
        working-directory: apps/landing-page-astro
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.worker.jsonc --tag "$GITHUB_SHA"

      - name: Purge codevetter.com edge cache
        if: steps.cloudflare.outputs.deploy_enabled == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID_CODEVETTER }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID_CODEVETTER not set; skipping edge cache purge."
            exit 0
          fi
          response="$(curl --silent --show-error --request POST \
            --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --write-out '\nHTTP_STATUS:%{http_code}' \
            --data '{"files":["https://codevetter.com/","https://www.codevetter.com/"]}')"
          status="${response##*HTTP_STATUS:}"
          body="${response%HTTP_STATUS:*}"
          echo "$body"
          if [ "$status" = "200" ]; then
            echo "Edge cache purged for codevetter.com"
            exit 0
          fi
          echo "::warning::Edge cache purge failed (HTTP ${status}); deployment completed without changing zone settings. Verify public content freshness before claiming the website is current."

      - name: Read back deployed provider identity
        if: steps.cloudflare.outputs.deploy_enabled == 'true'
        working-directory: apps/landing-page-astro
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          proof="$RUNNER_TEMP/codevetter-provider-proof"
          mkdir -p "$proof"
          pnpm exec wrangler deployments list --config wrangler.worker.jsonc --json |
            jq -e 'max_by(.created_on) | {id, created_on, versions}' > "$proof/deployment.json"
          version="$(jq -er '.versions | select(length == 1 and .[0].percentage == 100) | .[0].version_id' "$proof/deployment.json")"
          pnpm exec wrangler versions view "$version" --config wrangler.worker.jsonc --json |
            jq -e '{id, created_on: .metadata.created_on, tag: .annotations["workers/tag"]}' > "$proof/version.json"
          jq -e --arg sha "$GITHUB_SHA" --arg version "$version" '.id == $version and .tag == $sha' "$proof/version.json"
          pnpm exec wrangler pages deployment list --project-name codevetter --environment production --json |
            jq -e '.[0] | {Id, Environment, Branch, Source, Deployment, Status}' > "$proof/pages.json"
          jq -e --arg sha "$GITHUB_SHA" '.Environment == "Production" and .Branch == "main" and .Source == $sha[0:7]' "$proof/pages.json"
          jq -n --arg source "$GITHUB_SHA" --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile deployment "$proof/deployment.json" --slurpfile version "$proof/version.json" \
            --slurpfile pages "$proof/pages.json" \
            '{source: $source, observedAt: $observedAt, worker: $deployment[0], version: $version[0], pages: $pages[0]}' > "$proof/receipt.json"
          cat "$proof/receipt.json"

      - name: Preserve provider identity readback
        if: always() && steps.cloudflare.outputs.deploy_enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-provider-identity-${{ github.run_id }}
          path: ${{ runner.temp }}/codevetter-provider-proof/*.json
          retention-days: 14
          if-no-files-found: warn

      - name: Smoke production landing page
        run: curl --fail --silent --show-error --location --output /dev/null --retry 3 --retry-delay 5 --max-time 20 https://codevetter.com
