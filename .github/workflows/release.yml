name: Release Native macOS App

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.12.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Sign, notarize, and qualify the native replacement
    uses: ./.github/workflows/native-production-qualification.yml
    with:
      source_ref: ${{ github.event.release.tag_name || inputs.tag }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
      SPARKLE_EDDSA_PUBLIC_KEY: ${{ secrets.SPARKLE_EDDSA_PUBLIC_KEY }}
    permissions:
      contents: read

  publish:
    name: Upload qualified native release assets
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Download exact qualified production candidate
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: native-production-qualification-*
          path: artifacts/native-release
          merge-multiple: true
      - name: Verify and upload native assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          EXPECTED="$(sed -nE 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' apps/macos/Config/Shared.xcconfig)"
          test "$VERSION" = "$EXPECTED"
          DMG="$(find artifacts/native-release -name "CodeVetter-$VERSION-*.dmg" -type f -print -quit)"
          ZIP="$(find artifacts/native-release -name "CodeVetter-$VERSION-*.zip" -type f -print -quit)"
          APPCAST="$(find artifacts/native-release -name appcast.xml -type f -print -quit)"
          READINESS="$(find artifacts/native-release -name release-readiness.json -type f -print -quit)"
          test -n "$DMG"
          test -n "$ZIP"
          test -n "$APPCAST"
          test -n "$READINESS"
          jq -e '.shipping_ready == true and (.checks | all(.passed == true))' "$READINESS" >/dev/null
          gh release upload "$RELEASE_TAG" \
            "$DMG#CodeVetter-$VERSION-arm64.dmg" \
            "$ZIP#CodeVetter-$VERSION-arm64.zip" \
            "$APPCAST#appcast.xml" \
            --clobber --repo "$GITHUB_REPOSITORY"
      - name: Verify published release contract
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fx "CodeVetter-${RELEASE_TAG#v}-arm64.dmg" <<<"$ASSETS"
          grep -Fx "CodeVetter-${RELEASE_TAG#v}-arm64.zip" <<<"$ASSETS"
          grep -Fx appcast.xml <<<"$ASSETS"
          curl --fail --silent --show-error --location \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" >/dev/null
