name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_qualification:
        description: "Run isolated native macOS qualification"
        required: true
        default: false
        type: boolean
      native_interaction:
        description: "Include XCUITest on the isolated hosted desktop"
        required: true
        default: false
        type: boolean
      native_production_qualification:
        description: "Run protected signing, notarization, and migration qualification"
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-qualification:
    name: Native macOS qualification
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.native_qualification)
    uses: ./.github/workflows/native-qualification.yml
    with:
      run_interaction: ${{ github.event_name == 'pull_request' || inputs.native_interaction }}
    permissions:
      contents: read

  native-production-qualification:
    name: Native macOS production-candidate qualification
    if: github.event_name == 'workflow_dispatch' && inputs.native_production_qualification
    uses: ./.github/workflows/native-production-qualification.yml
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
      SPARKLE_EDDSA_PUBLIC_KEY: ${{ secrets.SPARKLE_EDDSA_PUBLIC_KEY }}
    permissions:
      contents: read

  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/codevetter-core
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Fetch code-health base
        if: github.event_name != 'workflow_dispatch'
        env:
          CODE_HEALTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: git fetch --depth=1 origin "$CODE_HEALTH_BASE"
      - name: Code health
        env:
          CODE_HEALTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          pnpm run quality:change-size
          pnpm run knip:strict
          pnpm run quality:complexity
          pnpm run quality:cycles
          pnpm run quality:duplication
      - name: Build and verify public indexing surfaces
        working-directory: apps/landing-page-astro
        run: |
          pnpm build
          node scripts/verify-agent-surfaces.mjs
      - name: Test hermetic automation contracts
        run: |
          pnpm test:automation
          pnpm test:corpus-contracts
          pnpm test:retrieval
          pnpm test:core-tools
      - name: Prepare CLI, MCP, and ccusage companions
        run: |
          pnpm core:prepare-mcp
          pnpm core:prepare-cli
          pnpm core:prepare-ccusage
          pnpm core:qualify-cli
      - name: Rust core, CLI, and MCP contracts
        run: |
          cargo test --manifest-path crates/codevetter-core/Cargo.toml --lib mcp
          cargo test --manifest-path crates/codevetter-core/Cargo.toml --bin codevetter-mcp
          cargo test --manifest-path crates/codevetter-core/Cargo.toml --test mcp_stdio
          cargo test --manifest-path crates/codevetter-core/Cargo.toml --features browser-agent --bin codevetter
