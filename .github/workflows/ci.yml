name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_qualification:
        description: "Run isolated native macOS qualification"
        required: true
        default: false
        type: boolean
      native_interaction:
        description: "Include XCUITest on the isolated hosted desktop"
        required: true
        default: false
        type: boolean
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-qualification:
    name: Native macOS qualification
    if: github.event_name == 'workflow_dispatch' && inputs.native_qualification
    uses: ./.github/workflows/native-qualification.yml
    with:
      run_interaction: ${{ inputs.native_interaction }}
    permissions:
      contents: read

  lint-and-typecheck:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/desktop
        run: pnpm run lint
      - name: Fetch code-health base
        if: github.event_name != 'workflow_dispatch'
        env:
          CODE_HEALTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: git fetch --depth=1 origin "$CODE_HEALTH_BASE"
      - name: Code health
        env:
          CODE_HEALTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          pnpm run quality:change-size
          pnpm run knip:strict
          pnpm run quality:complexity
          pnpm run quality:cycles
          pnpm run quality:duplication
          pnpm run quality:dependencies
      - name: Type Check
        working-directory: apps/desktop
        run: pnpm exec tsc --noEmit
      - name: Build and verify public indexing surfaces
        working-directory: apps/landing-page-astro
        run: |
          pnpm run build
          node scripts/verify-agent-surfaces.mjs
      - name: Install focused browser
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps chromium
      - name: Unit Tests
        working-directory: apps/desktop
        # Process-heavy differential fixtures model one singleton-owned daemon.
        # Serial file execution avoids multiplying Git/browser processes beyond
        # that production ownership boundary on constrained hosted runners.
        run: |
          pnpm exec node --import tsx --test --test-concurrency=1 "src/**/*.test.ts"
          pnpm exec node --import tsx --test tests/qualification/warm-verification-live.test.ts
      - name: Automation readiness tests
        # Hermetic receipt/corpus contract tests. The live manifest verifier
        # runs in release.yml as a post-upload check because it needs network.
        run: |
          pnpm run test:automation
          pnpm run test:corpus-contracts
          pnpm run test:retrieval
      - name: Prepare MCP sidecar
        working-directory: apps/desktop
        run: pnpm run prepare:mcp-sidecar
      - name: Prepare CLI sidecar
        working-directory: apps/desktop
        run: pnpm run prepare:cli-sidecar
      - name: Prepare and qualify ccusage sidecar
        working-directory: apps/desktop
        run: |
          pnpm run test:ccusage-sidecar
          pnpm run prepare:ccusage-sidecar
          CCUSAGE_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          "src-tauri/binaries/ccusage-$CCUSAGE_TARGET" --version
      - name: Qualify CLI artifact
        working-directory: apps/desktop
        run: |
          pnpm run test:cli-qualification
          pnpm run qualify:cli
      - name: Desktop build
        working-directory: apps/desktop
        run: pnpm run build
      - name: MCP protocol and safety tests
        working-directory: apps/desktop
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib mcp
          cargo test --manifest-path src-tauri/Cargo.toml --bin codevetter-mcp
          cargo test --manifest-path src-tauri/Cargo.toml --test mcp_stdio
      - name: T-Rex CLI contract tests
        working-directory: apps/desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml --features browser-agent --bin codevetter
      - name: MCP and history browser tests
        working-directory: apps/desktop
        run: pnpm exec playwright test tests/e2e/mcp-settings.spec.ts tests/e2e/repo-unpacked.spec.ts
