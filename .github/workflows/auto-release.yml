name: Auto-publish release

# When the native app version changes on main:
#   1. Create a GitHub release with tag v<version>.
#   2. Dispatch release.yml directly to build + sign + upload artifacts.
#
# Step 2 is required because workflows triggered by GITHUB_TOKEN (which is
# how step 1 creates the release) do NOT cascade to other workflows — this
# is a documented anti-recursion safeguard. workflow_dispatch is the one
# event that fires even from GITHUB_TOKEN, so we use it explicitly.
#
# Idempotent: if a release with that tag already exists, this no-ops.

on:
  push:
    branches: [main]
    paths:
      - "apps/macos/Config/Shared.xcconfig"
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release and dispatch build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the versioned GitHub release.
      actions: write # Dispatch the separate signed-build workflow.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read native application version
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' apps/macos/Config/Shared.xcconfig)
          if [ -z "$VERSION" ]; then
            echo "::error::No MARKETING_VERSION in apps/macos/Config/Shared.xcconfig"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CodeVetter $RELEASE_TAG" \
            --generate-notes

      - name: Dispatch release build workflow
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$RELEASE_TAG"
