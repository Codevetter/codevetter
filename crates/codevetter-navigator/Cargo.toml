[package]
name = "codevetter-navigator"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read-only Git source navigation for the native CodeVetter app"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.26.3"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
tempfile = "3"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
